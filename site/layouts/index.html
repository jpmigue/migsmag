{{ define "main" }}
<main class="main migsmag-home">
  <section class="migsmag-home__wrap">
    <img
      class="migsmag-home__logo"
      src="/images/header-logo_2400x600.png"
      alt="migsmag"
    />

    <div class="migsmag-home__bar" role="group" aria-label="Homepage prompt">
      <span class="migsmag-home__prompt" aria-hidden="true">Say something…</span>
      <button class="migsmag-home__btn" type="button">Go on then</button>
    </div>
    <nav class="migsmag-home__sections">
      {{ range .Site.Sections.ByTitle }}
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ end }}
    </nav>
  </section>
</main>
{{ end }}
