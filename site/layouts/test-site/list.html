{{ define "main" }}
<main class="main front-page">

  {{ with .Content }}
    <div class="front-page__intro">
      {{ . }}
    </div>
  {{ end }}

  <nav class="front-page__list">
    {{ range .RegularPages.ByTitle }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  </nav>
</main>
<button onclick="window.history.back();" style="margin-bottom: 1rem;">
  Back
</button>
{{ end }}
